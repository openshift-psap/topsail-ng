vaults:
- psap-forge-notifications
- psap-forge-mlflow-export
- psap-forge-aws-s3-export
- psap-forge-dashboard-s3
- psap-models-corp-rh
- psap-forge-hf

benchmarks:
  guidellm:
    enabled: true
    name: guidellm-benchmark
    image: ghcr.io/vllm-project/guidellm:v0.6.0
    timeout: 14400
    pvc_size: 10Gi
    hf_token_secret: "storage-config"
    fs_group: null
    args:
      backend_type: openai_http
      rate_type: concurrent
      output_dir: /results
      outputs: json

tests:
  rhaiis:
    model_key: qwen3-0_6b
    workload_key: profile1
    workload_keys: []
    run_benchmark: true
    warmup: true
    version: ""
    compare_version: ""
    slack_user: ""
    slack_notify_always: false

caliper:
  postprocess:
    enabled: true
    plugin_module: projects.rhaiis.postprocess.plugin
    parse:
      enabled: true
      no_cache: false
    visualize:
      enabled: false
    kpi:
      enabled: true
      artifacts_to_kpis:
        enabled: true
        output: kpis.json
      dashboard_csv:
        enabled: true
        output: dashboard.csv
    csv_dashboard:
      enabled: true
      s3_key: staging/rhaiis-dashboard/consolidated_dashboard.csv
    analyze:
      enabled: false
      historical_kpis: historical_kpis
      output: regression_analysis.json
      fail_on_regression: false

  export:
    from: null
    verbose: true
    dry_run: false
    backend:
      mlflow:
        enabled: true
        secrets:
          vault:
            name: psap-forge-mlflow-export
            mlflow_secret: mlflow-secret.yaml
        config:
          workspace: forge-rhaiis
          experiment: forge-rhaiis
          run_name: null
          description: "Caliper export from FORGE rhaiis benchmarks"
          source_script: rhaiis project
          tags: {}
          parameters: {}
          metrics: {}

agentic:
  enabled: true
  model_key: qwen-3-6-35b
  on_failure:
    enabled: true
  config_review:
    enabled: true
