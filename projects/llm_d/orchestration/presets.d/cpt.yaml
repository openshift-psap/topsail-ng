__multiple: true

# CPT reference profiles
cpt-reference-flavors:
  extends:
  - gpt-oss

  deployments.pd.ib.enabled: true
  runtime.deployment_profile:
  - pd-d.x2-p.tp1-d.tp4-p.x8
  - intelligentrouting-tp4-x4
  - simple-tp4-x4

cpt:
  caliper.export.backend.mlflow.config.experiment: cpt-llm-d
  caliper.postprocess.s3.instance: forge-cpt
  caliper.postprocess.s3.directory: llm-d/default
  caliper.postprocess.s3.export.enabled: true

cpt-xks:
  extends:
  - cpt
  cpt.kpi.labels.test_harness: xks
  caliper.postprocess.s3.directory: llm-d/xks

cpt-rhoai-release:
  extends:
  - cpt
  cpt.kpi.labels.test_harness: rhoai-release
  caliper.postprocess.s3.directory: llm-d/release

cpt-release-testing-rhoai:
  extends:
  - cpt-rhoai-release
  runtime.deployment_profile:
  - release-distributed-default
  - release-precise-prefix-cache
  - release-approximate-prefix-cache
  - release-upstream-optimized-baseline
  runtime.smoke_request_key: default
  runtime.benchmark_key:
  - concurrent-1k-1k
  - heavy-heterogeneous
  - multi-turn
  model_cache.pvc.size: 300Gi

cpt-release-testing-gpt-oss-120b:
  extends:
  - cpt-release-testing-rhoai
  - gpt-oss
  runtime.selected_preset: cpt-release-testing-gpt-oss-120b

cpt-release-testing-llama-33-70b:
  extends:
  - cpt-release-testing-rhoai
  - llama3-70b
  runtime.selected_preset: cpt-release-testing-llama-33-70b
