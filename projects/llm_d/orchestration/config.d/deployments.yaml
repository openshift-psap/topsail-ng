defaults:
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
  replicas: 1
  tensor_parallelism: 1
  serving_image: null
  router_image: null
  enable_monitors: true
  vllm_extra:
    args:
      gpu_memory_utilization: 0.92
      trust_remote_code: true
      no_enable_log_requests: true
      enable_prefix_caching: true

pd:
  vllm_extra:
    args:
    - --block-size 128
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
    env:
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
    - name: VLLM_HOST_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
  ib:
    enabled: false
    resources: rdma/ib

  roce:
    enabled: false
    resources: composite.dra.io/gpu-nic-pair

    vllm_extra:
      env:
      - name: KSERVE_INFER_ROCE
        value: "true"
      - name: NCCL_IB_GID_INDEX
        value: "3"

  efa:
    enabled: false
    image: quay.io/rajjoshi/libfabric-addon:3.5.0-1784900545
    manifest: manifests/pd-efa-config.yaml

    vllm_extra:
      kv_transfer_config:
        kv_connector_extra_config:
          backends: [LIBFABRIC]

    resources: vpc.amazonaws.com/efa

  shmem:
    size: null

profiles:
  approximate-prefix-cache:
    scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml

  precise-prefix-cache:
    scheduler_manifest: manifests/deployments/precise-prefix-cache.yaml

  distributed-default:
    scheduler: {}

  release-approximate-prefix-cache:
    scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml
    replicas: 4
    tensor_parallelism: 2
    vllm_extra:
      args:
        max_model_len: 40960

  release-precise-prefix-cache:
    scheduler_manifest: manifests/deployments/precise-prefix-cache.yaml
    replicas: 4
    tensor_parallelism: 2
    annotations:
      benchflow.io/prefix-caching: precise
    vllm_extra:
      args:
        max_model_len: 40960
        prefix_caching_hash_algo: sha256_cbor
        block_size: 64
        kv_events_config: "'{\"enable_kv_cache_events\": true, \"publisher\": \"zmq\", \"endpoint\": \"tcp://*:5556\", \"topic\": \"kv@$(POD_IP)@$(MODEL_NAME)\"}'"
      env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: MODEL_NAME
          value: __MODEL_NAME__
        - name: PYTHONHASHSEED
          value: "42"

  upstream-optimized-baseline:
    scheduler_manifest: manifests/deployments/upstream-optimized-baseline.yaml

  release-upstream-optimized-baseline:
    scheduler_manifest: manifests/deployments/upstream-optimized-baseline.yaml
    replicas: 4
    tensor_parallelism: 2
    vllm_extra:
      args:
        max_model_len: 40960

  release-distributed-default:
    scheduler: {}
    replicas: 4
    tensor_parallelism: 2
    vllm_extra:
      args:
        max_model_len: 40960

# Template flavor configurations with name-based extraction
templates:
  pd:
    scheduler_manifest: {}  # scheduler enabled with default config
    tensor_parallelism: FROM_NAME  # Extract main deployment tensor parallelism from profile name

    prefill:
      replicas: FROM_NAME
      tensor_parallelism: FROM_NAME
    decode:
      replicas: FROM_NAME
      tensor_parallelism: FROM_NAME


  intelligentrouting:
    scheduler_manifest: {}  # scheduler enabled with default config
    tensor_parallelism: FROM_NAME
    replicas: FROM_NAME

  simple:
    scheduler_manifest: null # scheduler disabled
    tensor_parallelism: FROM_NAME
    replicas: FROM_NAME
