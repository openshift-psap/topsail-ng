scheduler:
  template:
    containers:
      - name: main
        ports:
          - name: zmq
            containerPort: 5557
            protocol: TCP
        env:
          - name: TOKENIZER_CACHE_DIR
            value: /tmp/tokenizer-cache
          - name: HF_HOME
            value: /tmp/tokenizer-cache
          - name: TRANSFORMERS_CACHE
            value: /tmp/tokenizer-cache
          - name: XDG_CACHE_HOME
            value: /tmp
        args:
          - --cert-path
          - /var/run/kserve/tls
          - --pool-name
          - "{{ ChildName .ObjectMeta.Name `-inference-pool` }}"
          - --pool-namespace
          - "{{ .ObjectMeta.Namespace }}"
          - --zap-encoder
          - json
          - --grpc-port
          - "9002"
          - --grpc-health-port
          - "9003"
          - --secure-serving
          - --model-server-metrics-scheme
          - https
          - --config-text

          - __ENDPOINT_PICKER_CONFIG__

        volumeMounts:
          - name: tokenizer-cache
            mountPath: /tmp/tokenizer-cache
          - name: cachi2-cache
            mountPath: /cachi2
    volumes:
      - name: tokenizer-cache
        emptyDir: {}
      - name: cachi2-cache
        emptyDir: {}
