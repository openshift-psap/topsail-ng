namespace: kserve-e2e-perf
accelerator: nvidia
cpu_flavor: vanilla
cluster_tag: ""

gpu_types:
  nvidia: h200
  amd: mi300x
  l40s: l40s

# CPU image fallback (not engine-scoped since vLLM CPU is a distinct build)
images:
  cpu: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5.0-1786546771
  cpu-vanilla: docker.io/vllm/vllm-openai-cpu:v0.25.1

engine: vllm

engines:
  vllm:
    images:
      nvidia: vllm/vllm-openai:v0.24.0
      amd: quay.io/aipcc/rhaiis/rocm-ubi9:3.2.5
    port: 8080
    args:
      gpu-memory-utilization: 0.92
      trust-remote-code: true
      no-enable-log-requests: true
      no-enable-prefix-caching: true
      uvicorn-log-level: debug
  sglang:
    images:
      nvidia: lmsysorg/sglang:v0.5.11
      amd: lmsysorg/sglang:v0.5.4.post2-rocm700-mi30x
    port: 8080
    args: 
      enable-metrics: true
  trtllm:
    images:
      nvidia: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc13
    port: 8888
    args: {}
    trtllm_config:
      kv_cache_config:
        dtype: auto
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.90
        mamba_ssm_cache_dtype: ""
        mamba_ssm_stochastic_rounding: false
        mamba_ssm_philox_rounds: 0
      cuda_graph_config:
        enable_padding: false
        max_batch_size: 256
      enable_attention_dp: false
      enable_chunked_prefill: false
      num_postprocess_workers: 0
      moe_config:
        backend: CUTLASS
      stream_interval: 0
      print_iter_log: false

deploy:
  replicas: 1
  cpu_request: "4"
  memory_request: "16Gi"
  storage_source: hf
  storage_pvc: model-pvc
  storage_pvc_size: 200Gi
  image_pull_secrets: []
  service_account_name: ""
  ready_timeout: 3600
  health_check_timeout: 120
  node_selector: {}

vllm_args_cpu:
  no-enable-log-requests: true
  uvicorn-log-level: debug
  tensor-parallel-size: 1

env_vars: {}

accelerator_env_vars:
  nvidia: {}
  amd:
    VLLM_ROCM_USE_AITER: "1"
  cpu:
    VLLM_CPU_KVCACHE_SPACE: "10"
  cpu-rhaiis:
    LD_PRELOAD: /usr/lib64/libomp.so
  cpu-vanilla: {}

s3:
  bucket: psap-dashboard-data
  vault: psap-forge-dashboard-s3
  credentials_file: aws.credentials

warmup:
  rate: 200
  max_seconds: 60

profiler:
  enabled: false
  s3_bucket: psap-dashboard-data
  s3_prefix: pytorch-profiles/rhaiis
  vault: psap-forge-dashboard-s3
  labels: []
  rates: [200]
  max_seconds: 200

agent_analysis:
  enabled: false
  severity_threshold: 10
  url: ""
