nightly:
  caliper_export:
    experiment: nightly-pipeline-experiment
    run_naming:
      prefix: "mcp-gw-nightly"
      single_run: "{prefix}-{timestamp}-{outcome}"
  sources:
    ghcr:
      receiver: "projects.mcp_gateway.nightly_resolvers.ghcr_receiver.GHCRReceiver"
      repo: "Kuadrant/mcp-gateway"
      image: "kuadrant/mcp-gateway"
      mlflow_experiment: "mcp-gw-cpt-ghcr"
  verifier: "projects.caliper.orchestration.mlflow_verifier.CaliperMLflowVerifier"
  mlflow_verifier:
    experiment: "mcp-gw-cpt-ghcr"
    version_pattern: "-v(.+?)-\\d{8}-\\d{6}$"
    strip_prefix: "sha-"
  cluster: "agentic-cpt-8xa100"
  version_key: "infrastructure.mcp_gateway_version"
  pipeline: "forge-full"
  preset: "demo"
  owner: "ashtarkb"

vaults:
  all: []
  all-optional:
  - psap-forge-notifications
  - psap-forge-mlflow-export
  - psap-forge-aws-s3-export
  prepare: []
  test: []

notifications:
  slack:
    channel_id: C0BEBS6929L

metrics:
  enabled: true
  namespaces:
    - mcp-gw-bench
    - mcp-system
    - gateway-system
    - istio-system
  step_seconds: 15
  query_keys:
    - cpu_usage
    - cpu_throttling
    - memory_usage
    - memory_rss
    - memory_oom_kills
    - container_restarts
    - http_request_rate
    - http_error_rate
    - http_4xx_rate
    - http_latency_p50
    - http_latency_p95
    - http_latency_p99
    - network_rx_bytes
    - network_tx_bytes

caliper:
  postprocess:
    enabled: true
    artifacts_dir: null
    plugin_module: projects.mcp_gateway.postprocess.mcp_gateway.plugin
    postprocess_config: null
    parse:
      enabled: true
      no_cache: false
    visualize:
      enabled: false
    kpi:
      enabled: true
      artifacts_to_kpis:
        enabled: true
        output: kpis.json
      dashboard_csv:
        enabled: true
        output: kpis/dashboard.csv
      artifacts_to_ai_data:
        enabled: false
        output_dir: ai_data
    analyze:
      enabled: true
      current_kpis: kpis.json
      historical_kpis: historical_data
      output: regression_analyze/kpi_analyze.json
      fail_on_regression: false
    s3:
      bucket: psap-dashboard-data
      instance: mcp_gateway
      directory: nightly
      vault:
        name: psap-forge-aws-s3-export
        aws_credentials_file: aws.credentials
      import:
        enabled: true
        output_dir: historical_data
        include_kpis_json: true
        include_kpis_csv: true
        include_ai_data: false
        max_downloads: 50
      export:
        enabled: true
        upload_id: null
        dry_run: false
        include_csv: true
        include_kpis_json: true
        include_ai_data: false

  export:
    from: null
    verbose: true
    dry_run: false
    backend:
      mlflow:
        enabled: true
        secrets:
          vault:
            name: psap-forge-mlflow-export
            mlflow_secret: mlflow-secret.yaml
        config:
          run_name:
          experiment: mcp-gateway-cpt
          workspace: mcp-gw-cpt
          description: >
            MCP Gateway performance test results
          source_script: mcp_gateway project
          tags: {}
          parameters: {}
          metrics: {}
          run_naming:
            prefix: "forge-mcp-gateway"
            single_run: "{prefix}-s{num_servers}-u{users}-v{mcp_gateway_version}-{timestamp}"
            parent_run: "{prefix}-{preset}-{mcp_gateway_version}-{timestamp}"
            child_run: "{prefix}-s{num_servers}-u{users}-v{mcp_gateway_version}-{timestamp}"
